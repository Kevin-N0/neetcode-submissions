name: Notify Parent Repository

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: notify-parent
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check parent sync configuration
        env:
          PARENT_REPOSITORY: ${{ vars.PARENT_REPOSITORY }}
          GH_TOKEN: ${{ secrets.SUBMODULE_UPDATE_TOKEN }}
        run: |
          if [[ -z "${PARENT_REPOSITORY}" ]]; then
            echo "Parent sync not configured."
            echo "Set the repository variable:"
            echo "  PARENT_REPOSITORY=<owner>/<repository>"
            echo
            echo "Example:"
            echo "  PARENT_REPOSITORY=Kevin-N0/InterviewForge"
            exit 0
          fi

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Parent sync not configured."
            echo "Set the repository secret:"
            echo "  SUBMODULE_UPDATE_TOKEN"
            exit 0
          fi

          echo "Parent sync configured."
          echo "Target repository: ${PARENT_REPOSITORY}"

      - name: Trigger parent submodule update
        if: ${{ vars.PARENT_REPOSITORY != '' && secrets.SUBMODULE_UPDATE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_UPDATE_TOKEN }}
          PARENT_REPOSITORY: ${{ vars.PARENT_REPOSITORY }}
        run: |
          echo "Triggering parent repository update..."
          echo "Parent repository: ${PARENT_REPOSITORY}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PARENT_REPOSITORY}/dispatches" \
            --data '{
              "event_type": "submodule-updated",
              "client_payload": {
                "source": "neetcode-submissions"
              }
            }'

          echo
          echo "Parent repository dispatch sent successfully."