name: Notify Parent Repository

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notify-parent
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger parent submodule update
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_UPDATE_TOKEN }}
          PARENT_REPOSITORY: Kevin-N0/DISCIPLINE_EQ_FREEDOM
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PARENT_REPOSITORY}/dispatches" \
            --data '{"event_type":"submodule-updated","client_payload":{"source":"neetcode-submissions"}}'
