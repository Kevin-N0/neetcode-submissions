name: Notify Parent Repository

on:
  push:
    branches:
      - main
    paths:
      - "references/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-parent
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check parent sync configuration
        id: config
        env:
          PARENT_REPOSITORY: ${{ vars.PARENT_REPOSITORY }}
          GH_TOKEN: ${{ secrets.SUBMODULE_UPDATE_TOKEN }}
        run: |
          CONFIGURED=true

          if [[ -z "${PARENT_REPOSITORY}" ]]; then
            echo "Parent sync is not configured."
            echo "Missing repository variable:"
            echo "  PARENT_REPOSITORY=<owner>/<repository>"
            CONFIGURED=false
          fi

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Parent sync is not configured."
            echo "Missing repository secret:"
            echo "  SUBMODULE_UPDATE_TOKEN"
            CONFIGURED=false
          fi

          if [[ "${CONFIGURED}" == "true" ]]; then
            echo "Parent sync configured."
            echo "Target repository: ${PARENT_REPOSITORY}"
          else
            echo "Skipping parent notification."
          fi

          echo "configured=${CONFIGURED}" >> "${GITHUB_OUTPUT}"

      - name: Trigger parent submodule update
        if: ${{ steps.config.outputs.configured == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_UPDATE_TOKEN }}
          PARENT_REPOSITORY: ${{ vars.PARENT_REPOSITORY }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PARENT_REPOSITORY}/dispatches" \
            --data '{
              "event_type": "submodule-updated",
              "client_payload": {
                "source": "neetcode-submissions"
              }
            }'
